# Builds and deploys the site to GitHub Pages.
#
# Runs on every push to main, once a day (to refresh the GitHub
# contribution snapshot), and on demand from the Actions tab.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pull fresh contribution data. If GitHub or the API is down,
      # this keeps the snapshot already in the repo.
      - name: Refresh GitHub contribution snapshot
        run: python3 tools/refresh_contrib.py

      # Rebuilds fs.json and the README's "Recent blogposts" list.
      - name: Build
        run: python3 tools/build_manifest.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # .bashrc and .secret/ start with a dot; without this they'd be dropped
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
