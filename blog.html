<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matt's Writeups</title>
<meta name="description" content="CTF writeups and notes by Matthew Kocorowski.">
<style>
/* A reading page: one narrow column, a thin top bar, nothing else.
   Gruvbox Material, light in a light OS theme and dark in a dark one. */
:root {
  --bg: #fbf1c7;
  --panel: #f2e5bc;
  --fg: #4f3829;
  --fg-soft: #654735;
  --muted: #a89984;
  --line: #e3d7ad;
  --accent: #45707a;      /* blue */
  --accent-2: #c35e0a;    /* orange, for the event tag */
  --code-bg: #f2e5bc;
  --code-fg: #4f3829;
  --code-line: #e3d7ad;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: Consolas, "SF Mono", Menlo, Monaco, "Liberation Mono", "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #292828; --panel: #32302f; --fg: #d4be98; --fg-soft: #ddc7a1; --muted: #928374;
    --line: #3a3735; --accent: #7daea3; --accent-2: #e78a4e; --code-bg: #242322; --code-fg: #d4be98; --code-line: #3a3735;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #292828; --panel: #32302f; --fg: #d4be98; --fg-soft: #ddc7a1; --muted: #928374;
  --line: #3a3735; --accent: #7daea3; --accent-2: #e78a4e; --code-bg: #242322; --code-fg: #d4be98; --code-line: #3a3735;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 17px/1.7 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* top bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px clamp(16px, 5vw, 40px);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  font: 13px/1 var(--mono);
}
.bar a { color: var(--fg-soft); text-decoration: none; }
.back { display: inline-flex; align-items: center; gap: 7px; }
.back:hover { color: var(--accent); }
.back .arr { transition: transform .15s ease; }
.back:hover .arr { transform: translateX(-2px); }
.bar .here { color: var(--muted); }

/* shared column */
.wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 clamp(16px, 5vw, 40px); }
main { padding-block: clamp(32px, 7vw, 64px) 96px; }

/* ---------- index ---------- */
.lead { margin: 0 0 40px; }
.lead h1 { margin: 0 0 8px; font: 600 15px/1.3 var(--mono); letter-spacing: .02em; color: var(--fg); }
.lead p { margin: 0; color: var(--muted); font-size: 15px; max-width: 54ch; }

.list { display: flex; flex-direction: column; }
.entry { display: block; text-decoration: none; color: inherit; padding: 22px 0; border-top: 1px solid var(--line); }
.entry:last-child { border-bottom: 1px solid var(--line); }
.entry .meta { font: 12px/1 var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 9px; }
.entry .meta .ev { color: var(--accent-2); }
.entry h2 { margin: 0 0 7px; font: 600 21px/1.25 var(--sans); color: var(--fg); text-wrap: balance; transition: color .12s ease; }
.entry:hover h2 { color: var(--accent); }
.entry p { margin: 0; color: var(--fg-soft); font-size: 15px; }
.entry .tags { margin-top: 11px; font: 12px/1 var(--mono); color: var(--muted); }
.entry .tags span::before { content: "#"; opacity: .55; }
.entry .tags span + span { margin-left: 10px; }

/* ---------- a post ---------- */
.post-head { margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.post-head .meta { font: 12.5px/1 var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.post-head .meta .ev { color: var(--accent-2); }
.post-head h1 { margin: 0; font: 700 clamp(28px, 6vw, 38px)/1.15 var(--sans); letter-spacing: -.01em; text-wrap: balance; }
.post-head .tags { margin-top: 16px; font: 12px/1 var(--mono); color: var(--muted); }
.post-head .tags span::before { content: "#"; opacity: .55; }
.post-head .tags span + span { margin-left: 10px; }

/* rendered markdown */
.md { font-size: 17px; }
.md > *:first-child { margin-top: 0; }
.md h2 { margin: 44px 0 14px; font: 600 15px/1.3 var(--mono); letter-spacing: .03em; text-transform: uppercase; color: var(--accent); }
.md h3 { margin: 32px 0 12px; font: 600 19px/1.3 var(--sans); }
.md p { margin: 0 0 20px; }
.md a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.md a:hover { border-bottom-color: var(--accent); }
.md strong { color: var(--fg); font-weight: 650; }
.md ul, .md ol { margin: 0 0 20px; padding-left: 1.4em; }
.md li { margin: 6px 0; }
.md li::marker { color: var(--muted); }
.md blockquote {
  margin: 0 0 20px; padding: 2px 0 2px 18px;
  border-left: 2px solid var(--accent);
  color: var(--fg-soft); font-style: italic;
}
.md blockquote p:last-child { margin-bottom: 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0; }
.md :not(pre) > code {
  font: .86em/1.4 var(--mono);
  background: var(--code-bg);
  border: 1px solid var(--code-line);
  border-radius: 4px;
  padding: .08em .36em;
  word-break: break-word;
}
.md pre {
  margin: 0 0 24px;
  background: var(--code-bg);
  border: 1px solid var(--code-line);
  border-radius: 7px;
  padding: 16px 18px;
  overflow-x: auto;
  font: 14px/1.6 var(--mono);
  color: var(--code-fg);
  -webkit-overflow-scrolling: touch;
}
.md pre code { font: inherit; background: none; border: 0; padding: 0; }

.note { color: var(--muted); font: 14px/1.6 var(--mono); }
.note code { color: var(--accent); }

footer { border-top: 1px solid var(--line); padding: 22px 0 calc(22px + env(safe-area-inset-bottom, 0px)); }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; font: 12px/1.5 var(--mono); color: var(--muted); flex-wrap: wrap; }
footer a { color: var(--fg-soft); text-decoration: none; }
footer a:hover { color: var(--accent); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header class="bar">
    <a class="back" href="index.html"><span class="arr">‹</span>&nbsp;matt@kocorowski</a>
    <span class="here" id="here">~/blog</span>
  </header>

  <main>
    <div class="wrap" id="view" aria-live="polite"></div>
  </main>

  <footer>
    <div class="wrap">
      <span>matthew kocorowski</span>
      <span><a href="https://github.com/mattkoco" target="_blank" rel="noopener">github</a> · <a href="index.html">terminal</a></span>
    </div>
  </footer>

<script>
'use strict';
(function () {
  // carry over the terminal's saved theme so the two pages feel like one site
  try {
    var saved = localStorage.getItem('mk.theme');
    if (saved) {
      var light = ['github-light', 'solarized-light'];
      document.documentElement.dataset.theme = light.indexOf(saved) >= 0 ? 'light' : 'dark';
    }
  } catch (e) {}

  var view = document.getElementById('view');
  var here = document.getElementById('here');
  var SITE = 'Matt’s Writeups';
  var esc = function (s) { return s.replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
  var posts = [];

  /* A small, self-contained Markdown renderer. No CDN, no dependencies.
     Supports the subset these writeups use: headings, paragraphs, fenced
     code blocks, blockquotes, ordered/unordered lists, hr, and the inline
     set (code, bold, italic, links). Content is authored by me, so this
     doesn't try to be a hardened general-purpose parser. */
  function inline(s) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (m, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = esc(s);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) { return '<a href="' + u + '">' + t + '</a>'; });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^\w*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/\u0000(\d+)\u0000/g, function (m, n) { return '<code>' + esc(codes[+n]) + '</code>'; });
    return s;
  }
  var BLOCK_START = /^(```|#{1,6}\s|>\s?|---\s*$|\*\*\*\s*$|___\s*$|\s*(?:[-*+]|\d+\.)\s)/;
  function mdToHtml(src) {
    var lines = src.replace(/\r\n/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (/^```/.test(line)) {
        var lang = line.slice(3).trim(), buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code' + (lang ? ' class="language-' + esc(lang) + '"' : '') + '>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }
      if (/^(---|\*\*\*|___)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) { var n = h[1].length; out.push('<h' + n + '>' + inline(h[2].trim()) + '</h' + n + '>'); i++; continue; }
      if (/^>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
        out.push('<blockquote>' + mdToHtml(q.join('\n')) + '</blockquote>');
        continue;
      }
      if (/^\s*(?:[-*+]|\d+\.)\s+/.test(line)) {
        var ordered = /^\s*\d+\.\s/.test(line), items = [];
        while (i < lines.length && /^\s*(?:[-*+]|\d+\.)\s+/.test(lines[i])) {
          items.push('<li>' + inline(lines[i].replace(/^\s*(?:[-*+]|\d+\.)\s+/, '')) + '</li>'); i++;
        }
        out.push('<' + (ordered ? 'ol' : 'ul') + '>' + items.join('') + '</' + (ordered ? 'ol' : 'ul') + '>');
        continue;
      }
      if (/^\s*$/.test(line)) { i++; continue; }
      var para = [line]; i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !BLOCK_START.test(lines[i])) { para.push(lines[i]); i++; }
      out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  function tagRow(tags) { return (tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join(''); }

  function renderIndex() {
    here.textContent = '~/blog';
    document.title = SITE;
    var rows = posts.map(function (p) {
      return '<a class="entry" href="#' + encodeURIComponent(p.slug) + '">'
        + '<div class="meta"><span>' + esc(p.date || '') + '</span>'
        + (p.event ? '<span class="ev">' + esc(p.event) + '</span>' : '')
        + '</div>'
        + '<h2>' + esc(p.title) + '</h2>'
        + (p.summary ? '<p>' + esc(p.summary) + '</p>' : '')
        + (p.tags && p.tags.length ? '<div class="tags">' + tagRow(p.tags) + '</div>' : '')
        + '</a>';
    }).join('');
    view.innerHTML =
      '<div class="lead"><h1>~/blog</h1><p>CTF writeups and notes. Mostly pwn and Linux, occasionally whatever else I got nerd-sniped by.</p></div>'
      + (rows ? '<div class="list">' + rows + '</div>' : '<p class="note">No posts yet.</p>');
    document.title = SITE;
    window.scrollTo(0, 0);
  }

  function renderPost(post, bodyMd) {
    here.textContent = '~/blog/' + post.slug + '.md';
    document.title = post.title + ' — ' + SITE;
    var body = mdToHtml(bodyMd);
    view.innerHTML =
      '<article>'
      + '<div class="post-head">'
      + '<div class="meta"><span>' + esc(post.date || '') + '</span>'
      + (post.event ? '<span class="ev">' + esc(post.event) + '</span>' : '')
      + '</div>'
      + '<h1>' + esc(post.title) + '</h1>'
      + (post.tags && post.tags.length ? '<div class="tags">' + tagRow(post.tags) + '</div>' : '')
      + '</div>'
      + '<div class="md">' + body + '</div>'
      + '</article>';
    // open outbound links in a new tab; keep in-page ones put
    view.querySelectorAll('.md a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
    window.scrollTo(0, 0);
  }

  function showError(msg) {
    view.innerHTML = '<div class="lead"><h1>not found</h1></div><p class="note">' + esc(msg)
      + '<br><br><a href="#">‹ back to all posts</a></p>';
  }

  function route() {
    var slug = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
    if (!slug) { renderIndex(); return; }
    var post = posts.filter(function (p) { return p.slug === slug; })[0];
    if (!post) { showError('There’s no post called “' + slug + '”.'); return; }
    view.innerHTML = '<p class="note">loading…</p>';
    fetch('blog/' + post.slug + '.md')
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
      .then(function (md) { renderPost(post, md); })
      .catch(function () { showError('Couldn’t load this post. If you opened the file directly, serve the folder instead (python3 -m http.server).'); });
  }

  window.addEventListener('hashchange', route);
  fetch('blog/posts.json')
    .then(function (r) { return r.json(); })
    .then(function (data) { posts = (data && data.posts) || []; route(); })
    .catch(function () { showError('Couldn’t load the post list. Serve the folder over http rather than opening the file directly.'); });
})();
</script>
</body>
</html>
